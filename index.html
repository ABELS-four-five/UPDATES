/* =========================================================================
   TIME HELPERS — Asia/Manila
   ========================================================================= */
function phOffsetNow(){
  // Actual instant "now", used for real deltas (UTC-based, safe for math)
  return new Date();
}
function fmtDatePH(d){
  return d.toLocaleDateString('en-US', { timeZone:'Asia/Manila', month:'short', day:'numeric', year:'numeric' });
}
function fmtTimePH(d){
  return d.toLocaleTimeString('en-US', { timeZone:'Asia/Manila', hour:'numeric', minute:'2-digit', hour12:true });
}
function fmtDateTimePH(d){
  return `${fmtDatePH(d)} at ${fmtTimePH(d)}`;
}
function fmtWeekdayPH(d){
  return d.toLocaleDateString('en-US', { timeZone:'Asia/Manila', weekday:'long' });
}
function isoToLocalDate(iso){
  return new Date(iso);
}
function pad2(n){ return String(n).padStart(2,'0'); }
function to12h(hh, mm){
  const h = parseInt(hh,10); const m = parseInt(mm,10);
  const period = h >= 12 ? 'PM' : 'AM';
  let h12 = h % 12; if (h12 === 0) h12 = 12;
  return `${h12}:${pad2(m)} ${period}`;
}
/* Interpret a date+time input (from a <input type=date> + <input type=time>) as
   Philippine local time (UTC+8, no DST) and return a correct UTC ISO string,
   so deadlines count down correctly no matter where the visitor's browser is. */
function phDateTimeToISO(dateStr, timeStr){
  if (!dateStr) return null;
  const [y,m,d] = dateStr.split('-').map(Number);
  const [hh,mm] = (timeStr || "23:59").split(':').map(Number);
  const utcMs = Date.UTC(y, (m||1)-1, d||1, hh||0, mm||0, 0) - 8*3600*1000;
  return new Date(utcMs).toISOString();
}
/* Get the current Philippine wall-clock date/time fields (for "next class" day math) */
function phNowParts(){
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'Asia/Manila', hour12: false, weekday:'short',
    year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit'
  }).formatToParts(new Date());
  const o = {}; parts.forEach(p => o[p.type] = p.value);
  const weekdayIdx = DAY_SHORT.findIndex(s => s === o.weekday);
  return { y:+o.year, m:+o.month, d:+o.day, hh:+o.hour, mm:+o.minute, ss:+o.second, weekday: weekdayIdx };
}

/* =========================================================================
   DEADLINE STATUS
   green  >= 2 days away
   orange  5h .. 2 days away
   red     0 .. 5h away
   overdue past due
   ========================================================================= */
function getDeadlineStatus(iso){
  const now = phOffsetNow();
  const due = new Date(iso);
  const diffMs = due - now;
  const H = 3600*1000, D = 24*H;
  if (diffMs <= 0){
    return { key:'overdue', label:'TASK IS OVERDUE', cellClass:'bg-red-50 text-red-700 border-red-200', dotClass:'bg-red-600', pillClass:'bg-red-600 text-white' };
  }
  if (diffMs <= 5*H){
    return { key:'red', label: countdownText(diffMs), cellClass:'bg-red-50 text-red-700 border-red-200', dotClass:'bg-red-500', pillClass:'bg-red-100 text-red-700' };
  }
  if (diffMs <= 2*D){
    return { key:'orange', label: countdownText(diffMs), cellClass:'bg-amber-50 text-amber-700 border-amber-200', dotClass:'bg-amber-500', pillClass:'bg-amber-100 text-amber-700' };
  }
  return { key:'green', label: countdownText(diffMs), cellClass:'bg-emerald-50 text-emerald-700 border-emerald-200', dotClass:'bg-emerald-500', pillClass:'bg-emerald-100 text-emerald-700' };
}
function countdownText(diffMs){
  const H = 3600*1000, D=24*H;
  if (diffMs >= D){
    const d = Math.floor(diffMs/D);
    const h = Math.floor((diffMs%D)/H);
    return `Due in ${d}d${h>0?' '+h+'h':''}`;
  }
  const h = Math.floor(diffMs/H);
  const m = Math.floor((diffMs%H)/(60*1000));
  if (h > 0) return `Due in ${h}h ${m}m`;
  return `Due in ${m}m`;
}

/* =========================================================================
   SCHEDULE MATH
   ========================================================================= */
function nextClassOccurrence(){
  const np = phNowParts();
  let best = null;
  state.schedule.forEach(cls => {
    let delta = (cls.day - np.weekday + 7) % 7;
    if (delta === 0){
      const [sh, sm] = cls.start.split(':').map(Number);
      const passedToday = (np.hh > sh) || (np.hh === sh && np.mm >= sm);
      if (passedToday) delta = 7;
    }
    const base = new Date(Date.UTC(np.y, np.m-1, np.d));
    base.setUTCDate(base.getUTCDate() + delta);
    const dateStr = `${base.getUTCFullYear()}-${pad2(base.getUTCMonth()+1)}-${pad2(base.getUTCDate())}`;
    const iso = phDateTimeToISO(dateStr, cls.start);
    const dateObj = new Date(iso);
    if (!best || dateObj < best.dateObj){
      best = { cls, iso, dateObj, isToday: delta === 0, isTomorrow: delta === 1 };
    }
  });
  return best;
}

/* =========================================================================
   COLOR HELPERS (for the announcement's custom background)
   ========================================================================= */
function relLuminance(hex){
  const c = (hex||'#FFFFFF').replace('#','');
  if (c.length !== 6) return 1;
  const r = parseInt(c.substr(0,2),16)/255, g=parseInt(c.substr(2,2),16)/255, b=parseInt(c.substr(4,2),16)/255;
  const lin = v => v<=0.03928? v/12.92 : Math.pow((v+0.055)/1.055,2.4);
  return 0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
}
function textColorFor(bgHex){
  try{ return relLuminance(bgHex) > 0.55 ? '#2B1218' : '#FFFFFF'; }catch(e){ return '#2B1218'; }
}
function subtleTextColorFor(bgHex){
  return relLuminance(bgHex) > 0.55 ? 'rgba(43,18,24,0.65)' : 'rgba(255,255,255,0.78)';
}

/* =========================================================================

   ========================================================================= */
const STATUS_RANK = { overdue:0, red:1, orange:2, green:3 };
function sortedTodos(list){
  return [...list].sort((a,b) => {
    if (a.completed !== b.completed) return a.completed ? 1 : -1;
    const ra = STATUS_RANK[getDeadlineStatus(a.deadline).key];
    const rb = STATUS_RANK[getDeadlineStatus(b.deadline).key];
    if (ra !== rb) return ra - rb;
    return new Date(a.deadline) - new Date(b.deadline);
  });
}

function filterTodos(list, filter){
  return list.filter(t => {
    const st = getDeadlineStatus(t.deadline).key;
    if (filter === 'pending') return !t.completed;
    if (filter === 'duesoon') return !t.completed && (st === 'red' || st === 'orange');
    if (filter === 'overdue') return !t.completed && st === 'overdue';
    if (filter === 'completed') return t.completed;
    return true; // all
  });
}

  root.querySelectorAll('[data-todo-complete]').forEach(b => b.addEventListener('click', async () => {
    const t = state.todos.find(x => x.id === b.dataset.todoComplete);
    if (!t) return;
    t.completed = !t.completed;
    await persist();
    renderPage(currentPage);
    showToast(t.completed ? 'Task marked completed' : 'Task marked pending');
  }));
  root.querySelectorAll('[data-todo-delete]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.todoDelete;
    openConfirmModal({
      title: 'Delete this task?',
      message: 'This cannot be undone.',
      confirmLabel: 'Delete',
      danger: true,
      onConfirm: async () => {
        state.todos = state.todos.filter(x => x.id !== id);
        await persist();
        renderAll();
        showToast('Task deleted');
      }
    });
  }));
}

  state.todos.filter(t => t.isEvent && !t.completed).forEach(t => {

/* =========================================================================
   MODAL STACK UTILITIES
   ========================================================================= */
let modalStack = [];
function renderModal(html, stacked){
  const root = document.getElementById('modal-root');
  if (!stacked){ root.innerHTML = ''; modalStack = []; }
  const wrapper = document.createElement('div');
  wrapper.innerHTML = html.trim();
  const node = wrapper.firstElementChild;
  root.appendChild(node);
  modalStack.push(node);
  wireModalCommon(node);
  return node;
}
function wireModalCommon(node){
  node.querySelectorAll('[data-close-modal]').forEach(b => b.addEventListener('click', () => {
    if (node.parentNode) node.parentNode.removeChild(node);
    modalStack = modalStack.filter(n => n !== node);
  }));
}
function closeTopModal(){
  const node = modalStack.pop();
  if (node && node.parentNode) node.parentNode.removeChild(node);
}
function closeAllModals(){
  document.getElementById('modal-root').innerHTML = '';
  modalStack = [];
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modalStack.length) closeTopModal();
});

        </button>`;
      }).join('')}
    </div>
  </div>`;
}

function pillGroup(name, options, current, extraAttr){
  return options.map(o => `<button type="button" data-pill="${name}" data-value="${o.value}" class="toggle-pill px-4 py-2 rounded-xl text-sm font-semibold border ${current === o.value ? (o.activeClass || 'bg-brand text-white border-brand') : 'bg-white text-gray-600 border-gray-200 hover:border-brandSoft'}">${o.label}</button>`).join('');
}

/* =========================================================================
   CUSTOM CONFIRM MODAL (native confirm()/prompt() are unreliable in sandboxed
   iframes, so every destructive action routes through this instead)
   ========================================================================= */
function openConfirmModal(opts){
  const o = Object.assign({ title:'Are you sure?', message:'', confirmLabel:'Confirm', danger:true, onConfirm:()=>{} }, opts);
  const html = `
  <div class="fixed inset-0 z-[80] flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="absolute inset-0 bg-ink/45" data-close-modal></div>
    <div class="relative bg-white w-full sm:max-w-sm rounded-t-3xl sm:rounded-3xl shadow-2xl pop-in p-6 text-center">
      <div class="w-12 h-12 rounded-2xl ${o.danger ? 'bg-red-50 text-red-600' : 'bg-brandLight text-brand'} flex items-center justify-center mx-auto mb-3">
        <span class="w-6 h-6">${o.danger ? ICON.trash : ICON.info}</span>
      </div>
      <h3 class="text-lg font-bold">${escapeHtml(o.title)}</h3>
      ${o.message ? `<p class="text-sm text-gray-500 mt-1.5">${escapeHtml(o.message)}</p>` : ''}
      <div class="flex items-center gap-2 mt-5">
        <button data-close-modal class="flex-1 px-4 py-2.5 rounded-xl text-sm font-semibold text-gray-600 hover:bg-gray-100 border border-gray-200">Cancel</button>
        <button id="btn-confirm-yes" class="flex-1 px-4 py-2.5 rounded-xl text-sm font-semibold text-white ${o.danger ? 'bg-red-600 hover:bg-red-700' : 'bg-brand hover:bg-brandDark'}">${escapeHtml(o.confirmLabel)}</button>
      </div>
    </div>
  </div>`;
  const node = renderModal(html, true);
  node.querySelector('#btn-confirm-yes').addEventListener('click', () => {
    closeTopModal();
    o.onConfirm();
  });
}

/* ---------------- WIZARD STEP 2 ---------------- */
function buildStep2(){
  if (wizard.type === 'schedule') return buildScheduleStep2();

}
function typeHeaderHtml(key, title, desc){
  const th = TYPE_THEME[key];
  const iconKey = key === 'schedule' ? 'calendar' : key === 'todo' ? 'checklist' : 'megaphone';
  return `
  <div class="flex items-start gap-3 ${th.bg} rounded-2xl p-4 mb-5">
    <div class="w-10 h-10 rounded-xl bg-white/70 ${th.text} flex items-center justify-center shrink-0"><span class="w-5 h-5">${ICON[iconKey]}</span></div>

      <p class="font-bold ${th.text}">${title}</p>

/* ---------------- WIZARD STEP 3 — REVIEW ---------------- */
function buildStep3(){
  const th = TYPE_THEME[wizard.type];
  const typeLabel = wizard.type === 'schedule' ? 'Schedule Update' : wizard.type === 'todo' ? 'To-Do List Update' : 'Main Announcement';
  const iconKey = wizard.type === 'schedule' ? 'calendar' : wizard.type === 'todo' ? 'checklist' : 'megaphone';

  let body = '';
  if (wizard.type === 'schedule'){
    const s = wizard.schedule;
    const dateObj = new Date(s.date + 'T00:00:00');
    body = `
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mt-5">Title / Subject</p>
      <p class="text-xl font-bold text-gray-900 mt-1">${escapeHtml(s.title || '(untitled)')}</p>
      <div class="flex flex-wrap gap-2 mt-3">
        <span class="px-3 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-700">${escapeHtml(s.modality)}</span>
        <span class="px-3 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-700">${dateObj.toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric', year:'numeric'})}</span>
        <span class="px-3 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-700">${s.useDefaultTime==='yes' ? 'Regular class time' : to12h(...s.time.split(':'))}${s.hasEndTime==='yes' && s.endTime ? ' – ' + to12h(...s.endTime.split(':')) : ''}</span>
      </div>`;
  } else if (wizard.type === 'todo'){
    const t = wizard.todo;
    const deadlineIso = phDateTimeToISO(t.date, t.time);
    const due = new Date(deadlineIso);
    body = `
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mt-5">Course</p>
      <p class="text-base font-semibold text-gray-900 mt-1">${escapeHtml(t.course)} — ${escapeHtml(courseTitle(t.course))}</p>
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mt-4">Task</p>
      <p class="text-xl font-bold text-gray-900 mt-1">${escapeHtml(t.title || '(untitled)')}</p>
      ${t.description ? `<p class="text-sm text-gray-600 mt-1.5">${escapeHtml(t.description)}</p>` : ''}
      <div class="flex flex-wrap gap-2 mt-3">
        <span class="px-3 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-700">Due ${fmtDateTimePH(due)}</span>
        <span class="px-3 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-700">${t.priority} priority</span>
        ${t.isEvent === 'yes' ? `<span class="px-3 py-1 rounded-full text-xs font-semibold bg-purple-100 text-purple-700">Shows in Upcoming Events</span>` : ''}
        ${t.urgent ? `<span class="px-3 py-1 rounded-full text-xs font-semibold bg-red-100 text-red-700">Urgent</span>` : ''}
      </div>`;
  } else if (wizard.type === 'announcement'){
    const a = wizard.announcement;
    const textColor = textColorFor(a.bg);
    body = `
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mt-5">Title / Subject</p>
      <p class="text-xl font-bold text-gray-900 mt-1">${escapeHtml(a.title || '(untitled)')}</p>
      <div class="mt-3 rounded-2xl p-4 rte text-sm leading-7" style="background:${a.bg}; color:${textColor}">
        ${a.bodyHtml && a.bodyHtml.replace(/<[^>]+>/g,'').trim() ? a.bodyHtml : '<p class="opacity-50">(no content yet)</p>'}
      </div>`;
  }

  return `
  <div>
    <h4 class="font-bold text-gray-900">Review your update</h4>
    <p class="text-sm text-gray-500 mt-0.5">Please review the details before posting.</p>
    <span class="inline-flex items-center gap-1.5 mt-4 px-3 py-1.5 rounded-full text-xs font-bold ${th.bg} ${th.text}"><span class="w-3.5 h-3.5">${ICON[iconKey]}</span>${typeLabel}</span>
    ${body}
    <p class="text-xs text-gray-400 mt-5">Posting on: ${fmtDateTimePH(new Date())}</p>
  </div>`;
}
