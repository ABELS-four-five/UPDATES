<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UPDATES — AB ELS 4-5</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Tailwind config overrides */
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#7C3AED',
            'brand-light': '#EDE9FE',
            'brand-dark': '#6D28D9',
          },
          borderRadius: {
            '2xl': '1.25rem',
            '3xl': '1.5rem',
          }
        }
      }
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">

  <!-- ==================== DESKTOP WRAPPER ==================== -->
  <div id="app-wrapper" class="max-w-md mx-auto min-h-screen bg-white shadow-xl relative pb-20 lg:my-6 lg:rounded-3xl lg:min-h-0 lg:overflow-hidden">

    <!-- ==================== HEADER ==================== -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-gray-100 px-5 py-4">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-extrabold tracking-tight text-brand">UPDATES</h1>
          <p class="text-xs font-semibold text-gray-400 tracking-widest uppercase">AB ELS 4-5</p>
        </div>
        <div class="w-9 h-9 rounded-full bg-brand-light flex items-center justify-center">
          <svg class="w-5 h-5 text-brand" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
        </div>
      </div>
    </header>

    <!-- ==================== MAIN SCROLLABLE CONTENT ==================== -->
    <main id="main-scroll" class="overflow-y-auto" style="height:calc(100vh - 64px - 64px)">

      <!-- ========== HOME SECTION ========== -->
      <section id="section-home" class="tab-section px-5 pt-5 pb-8 space-y-5">

        <!-- Greeting -->
        <div>
          <p class="text-gray-500 text-sm">Hello there! 👋</p>
          <h2 class="text-lg font-bold text-gray-800">Here's what's new and what's next</h2>
        </div>

        <!-- Main Announcement Card -->
        <div id="announcement-card" class="bg-white rounded-3xl border-l-4 border-brand p-5 shadow-sm">
          <div class="flex items-center gap-2 mb-3">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-brand-light text-brand">Announcement</span>
            <span id="announcement-date" class="text-xs text-gray-400"></span>
          </div>
          <h3 id="announcement-title" class="text-base font-bold text-gray-900 mb-2"></h3>
          <p id="announcement-body" class="text-sm text-gray-600 leading-relaxed"></p>
        </div>

        <!-- Status Grid: Next Class + Modality -->
        <div class="grid grid-cols-2 gap-3">
          <div id="next-class-card" class="bg-white rounded-2xl p-4 shadow-sm">
            <div class="flex items-center gap-1.5 mb-2">
              <svg class="w-4 h-4 text-brand" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <span class="text-xs font-semibold text-gray-400 uppercase">Next Class</span>
            </div>
            <p id="next-class-name" class="text-sm font-bold text-gray-800 truncate"></p>
            <p id="next-class-time" class="text-xs text-gray-500 mt-1"></p>
          </div>
          <div id="modality-card" class="bg-brand-light rounded-2xl p-4">
            <div class="flex items-center gap-1.5 mb-2">
              <svg class="w-4 h-4 text-brand" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
              <span class="text-xs font-semibold text-brand uppercase">Modality</span>
            </div>
            <p id="modality-text" class="text-sm font-bold text-brand">Face-to-Face</p>
          </div>
        </div>

        <!-- Urgent Tasks Card -->
        <div id="urgent-tasks-card" class="hidden bg-red-50 rounded-2xl p-4 border border-red-100">
          <div class="flex items-center gap-2 mb-2">
            <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <span class="text-xs font-semibold text-red-600 uppercase">Urgent Tasks</span>
          </div>
          <div id="urgent-tasks-list" class="space-y-1.5"></div>
        </div>

        <!-- To-Do List Section -->
        <div>
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-base font-bold text-gray-800">To-Do List</h3>
            <span id="todo-count" class="text-xs text-gray-400"></span>
          </div>
          <!-- Filter Pills -->
          <div id="todo-filters" class="flex gap-2 mb-4 overflow-x-auto">
            <button data-filter="all" class="filter-pill active">All</button>
            <button data-filter="pending" class="filter-pill">Pending</button>
            <button data-filter="due-soon" class="filter-pill">Due Soon</button>
            <button data-filter="completed" class="filter-pill">Completed</button>
          </div>
          <div id="todo-list" class="space-y-3"></div>
        </div>

        <!-- Upcoming Events -->
        <div>
          <h3 class="text-base font-bold text-gray-800 mb-3">Upcoming Events</h3>
          <div id="events-list" class="space-y-3"></div>
        </div>

        <!-- Quick Links -->
        <div>
          <h3 class="text-base font-bold text-gray-800 mb-3">Quick Links</h3>
          <div class="grid grid-cols-4 gap-3">
            <a href="#" class="flex flex-col items-center gap-1.5 p-3 rounded-2xl bg-gray-50 hover:bg-brand-light transition-colors">
              <svg class="w-6 h-6 text-brand" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>
              <span class="text-xs text-gray-600 font-medium">Drive</span>
            </a>
            <a href="#" class="flex flex-col items-center gap-1.5 p-3 rounded-2xl bg-gray-50 hover:bg-brand-light transition-colors">
              <svg class="w-6 h-6 text-brand" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
              <span class="text-xs text-gray-600 font-medium">Library</span>
            </a>
            <a href="#" class="flex flex-col items-center gap-1.5 p-3 rounded-2xl bg-gray-50 hover:bg-brand-light transition-colors">
              <svg class="w-6 h-6 text-brand" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
              <span class="text-xs text-gray-600 font-medium">Email</span>
            </a>
            <a href="#" class="flex flex-col items-center gap-1.5 p-3 rounded-2xl bg-gray-50 hover:bg-brand-light transition-colors">
              <svg class="w-6 h-6 text-brand" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
              <span class="text-xs text-gray-600 font-medium">Chat</span>
            </a>
          </div>
        </div>

      </section>

      <!-- ========== SCHEDULE SECTION ========== -->
      <section id="section-schedule" class="tab-section hidden px-5 pt-5 pb-8 space-y-4">
        <h2 class="text-lg font-bold text-gray-800">Class Schedule</h2>
        <div id="schedule-list" class="space-y-3"></div>
      </section>

      <!-- ========== PROFESSORS SECTION ========== -->
      <section id="section-professors" class="tab-section hidden px-5 pt-5 pb-8 space-y-4">
        <h2 class="text-lg font-bold text-gray-800">Our Professors</h2>
        <div id="professors-list" class="space-y-3"></div>
      </section>

    </main>

    <!-- ==================== FLOATING CREATE BUTTON ==================== -->
    <a href="admin.html" id="fab-create" class="fixed z-50 bottom-20 right-5 lg:right-auto lg:left-1/2 lg:ml-36 w-14 h-14 bg-brand hover:bg-brand-dark text-white rounded-full shadow-lg flex items-center justify-center transition-all fab-pulse" title="Create Update">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
    </a>

    <!-- ==================== BOTTOM NAVIGATION ==================== -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-gray-100 shadow-lg">
      <div class="max-w-md mx-auto flex justify-around py-2">
        <button data-tab="home" class="nav-tab active flex flex-col items-center gap-0.5 py-1 px-3">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4" />
          </svg>
          <span class="text-xs font-medium">Home</span>
        </button>
        <button data-tab="schedule" class="nav-tab flex flex-col items-center gap-0.5 py-1 px-3">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          <span class="text-xs font-medium">Schedule</span>
        </button>
        <button data-tab="professors" class="nav-tab flex flex-col items-center gap-0.5 py-1 px-3">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <span class="text-xs font-medium">Professors</span>
        </button>
        <a href="admin.html" class="nav-tab flex flex-col items-center gap-0.5 py-1 px-3">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
          </svg>
          <span class="text-xs font-medium">Edit</span>
        </a>
      </div>
    </nav>

  </div><!-- end app-wrapper -->

  <script src="script.js"></script>
</body>
</html>
